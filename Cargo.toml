[package]
name = "frump"
version = "0.1.2"
authors = ["Sologub <sologub@gmail.com>"]
edition = "2021"
description = "Distributed task management tool based on Git and Markdown"
license = "MIT"
repository = "https://github.com/sologub/frump"
readme = "README.md"
keywords = ["tasks", "git", "markdown", "kanban", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "USAGE.md",
    "TUTORIAL.md",
    "LICENSE-MIT",
    "ui/src/**",
    "ui/tests/**",
    "ui/*.ts",
    "ui/index.html",
    "ui/package.json",
    "ui/package-lock.json",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
git2 = "0.19"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }
csv = "1.3"
fs2 = "0.4"
strsim = "0.11"
axum = "0.8"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
proptest = "1.4"
