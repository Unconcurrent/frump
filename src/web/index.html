<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frump Board</title>
<style>
@layer reset, tokens, layout, controls, board, editor, utilities;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  h1, h2, h3, p { margin: 0; }
  button, input, textarea, select { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
}

@layer tokens {
  :root {
    color-scheme: light dark;

    /* Palette values live once; the theme blocks below only re-alias them. */
    --l-page: #f5f6f9;      --d-page: #0d1017;
    --l-rail: #eceff4;      --d-rail: #151a23;
    --l-card: #ffffff;      --d-card: #1c222d;
    --l-field: #ffffff;     --d-field: #141a23;
    --l-chrome: #ffffff;    --d-chrome: #11161e;
    --l-text: #171a20;      --d-text: #e8ebf1;
    --l-muted: #5a6273;     --d-muted: #9aa5b8;
    --l-faint: #6b7280;     --d-faint: #8b97aa;
    --l-line: #dfe3ea;      --d-line: #29313f;
    --l-line-strong: #c2c9d6; --d-line-strong: #3a4454;
    --l-accent: #2a5fd0;    --d-accent: #6c9cff;
    --l-accent-hover: #1f4cb0; --d-accent-hover: #86aeff;
    --l-accent-soft: #e4ecfd; --d-accent-soft: #1c2a3f;
    --l-on-accent: #ffffff; --d-on-accent: #0b1220;
    --l-danger: #b52d2d;    --d-danger: #ef7676;
    --l-warn-bg: #fdf4d6;   --d-warn-bg: #372f10;
    --l-warn-fg: #4a3b00;   --d-warn-fg: #f2e3ae;
    --l-err-bg: #fbe4e4;    --d-err-bg: #3a1b1b;
    --l-err-fg: #6b1616;    --d-err-fg: #f7cccc;
    --l-mark: #ffe27a;      --d-mark: #6b5a12;
    --l-shadow: 0 1px 2px rgb(16 24 40 / .07), 0 1px 3px rgb(16 24 40 / .05);
    --d-shadow: 0 1px 2px rgb(0 0 0 / .55);
    --l-lift: 0 6px 16px rgb(16 24 40 / .13);
    --d-lift: 0 8px 20px rgb(0 0 0 / .6);
    /* Hue-derived accents: a card carries only --hue, the theme sets the range. */
    --l-hue: hsl(var(--hue, 220) 52% 42%);   --d-hue: hsl(var(--hue, 220) 62% 70%);
    --l-hue-soft: hsl(var(--hue, 220) 62% 95%); --d-hue-soft: hsl(var(--hue, 220) 32% 22%);

    --page: var(--l-page); --rail: var(--l-rail); --card: var(--l-card);
    --field: var(--l-field); --chrome: var(--l-chrome); --text: var(--l-text);
    --muted: var(--l-muted); --faint: var(--l-faint); --line: var(--l-line);
    --line-strong: var(--l-line-strong); --accent: var(--l-accent);
    --accent-hover: var(--l-accent-hover); --accent-soft: var(--l-accent-soft);
    --on-accent: var(--l-on-accent); --danger: var(--l-danger);
    --warn-bg: var(--l-warn-bg); --warn-fg: var(--l-warn-fg);
    --err-bg: var(--l-err-bg); --err-fg: var(--l-err-fg); --mark: var(--l-mark);
    --shadow: var(--l-shadow); --lift: var(--l-lift);
    --hue-accent: var(--l-hue); --hue-soft: var(--l-hue-soft);

    --sheet-inline: var(--pad);      /* .sheet widens this to centre its content */
    --panel-w: clamp(23rem, 34vw, 40rem);
    --r-s: 6px; --r-m: 9px; --r-l: 14px;
    --gap: .5rem;
    --pad: clamp(.75rem, 1.6vw, 1.1rem);
    --card-pad: .7rem;
    --body-lines: 3;

    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text);
    accent-color: var(--accent);
  }

  /* System preference wins unless the viewer picked a theme explicitly. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: var(--d-page); --rail: var(--d-rail); --card: var(--d-card);
      --field: var(--d-field); --chrome: var(--d-chrome); --text: var(--d-text);
      --muted: var(--d-muted); --faint: var(--d-faint); --line: var(--d-line);
      --line-strong: var(--d-line-strong); --accent: var(--d-accent);
      --accent-hover: var(--d-accent-hover); --accent-soft: var(--d-accent-soft);
      --on-accent: var(--d-on-accent); --danger: var(--d-danger);
      --warn-bg: var(--d-warn-bg); --warn-fg: var(--d-warn-fg);
      --err-bg: var(--d-err-bg); --err-fg: var(--d-err-fg); --mark: var(--d-mark);
      --shadow: var(--d-shadow); --lift: var(--d-lift);
      --hue-accent: var(--d-hue); --hue-soft: var(--d-hue-soft);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: var(--d-page); --rail: var(--d-rail); --card: var(--d-card);
    --field: var(--d-field); --chrome: var(--d-chrome); --text: var(--d-text);
    --muted: var(--d-muted); --faint: var(--d-faint); --line: var(--d-line);
    --line-strong: var(--d-line-strong); --accent: var(--d-accent);
    --accent-hover: var(--d-accent-hover); --accent-soft: var(--d-accent-soft);
    --on-accent: var(--d-on-accent); --danger: var(--d-danger);
    --warn-bg: var(--d-warn-bg); --warn-fg: var(--d-warn-fg);
    --err-bg: var(--d-err-bg); --err-fg: var(--d-err-fg); --mark: var(--d-mark);
    --shadow: var(--d-shadow); --lift: var(--d-lift);
    --hue-accent: var(--d-hue); --hue-soft: var(--d-hue-soft);
  }
  :root[data-density="compact"] { --card-pad: .5rem; --gap: .35rem; --body-lines: 0; }
}

@layer layout {
  /* The page never scrolls: the board scrolls inline, columns scroll block-wise. */
  body {
    block-size: 100dvh;
    display: grid;
    grid-template-rows: auto auto auto minmax(0, 1fr);
    overflow: hidden;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: var(--gap) var(--pad);
    align-items: center;
    justify-content: space-between;
    padding: .6rem var(--pad);
    background: var(--chrome);
    border-block-end: 1px solid var(--line);
  }
  .toolbar {
    display: flex;
    gap: var(--gap);
    align-items: center;
    padding: .5rem var(--pad);
    background: var(--chrome);
    border-block-end: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  /* Grid and flex items default to min-size:auto, which lets a scrollable
     child widen the page instead of scrolling inside itself. */
  header, .toolbar, main, .notice, .board, .column, .cards, .card, .card > * { min-inline-size: 0; }
  main { min-block-size: 0; overflow: hidden; }
  .board {
    block-size: 100%;
    display: flex;
    align-items: stretch;
    gap: var(--gap);
    padding: var(--pad);
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: inline proximity;
    overscroll-behavior-inline: contain;
  }
}

@layer controls {
  .brand { display: flex; align-items: center; gap: .6rem; min-inline-size: 0; }
  .brand .mark {
    inline-size: 1.9rem; block-size: 1.9rem; border-radius: 8px; flex: none;
    display: grid; place-items: center; font-weight: 800; font-size: .8rem;
    background: var(--accent); color: var(--on-accent);
  }
  .brand h1 { font-size: 1rem; font-weight: 650; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-inline-size: 52vw; }
  .brand p { font-size: .74rem; color: var(--faint); }
  .head-actions { display: flex; gap: var(--gap); align-items: center; }

  button {
    display: inline-flex; align-items: center; gap: .35rem;
    border: 1px solid transparent; border-radius: var(--r-s);
    padding: .4rem .7rem; cursor: pointer;
    background: var(--accent); color: var(--on-accent); font-size: .85rem; font-weight: 550;
    transition: background-color .14s ease, border-color .14s ease, color .14s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button.ghost { background: transparent; color: var(--text); border-color: var(--line-strong); font-weight: 500; }
  button.ghost:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
  button.bare { background: transparent; color: var(--muted); border-color: transparent; padding: .25rem; }
  button.bare:hover:not(:disabled) { background: var(--accent-soft); color: var(--text); }
  button.danger { background: transparent; color: var(--danger); border-color: currentColor; }
  button.danger:hover:not(:disabled) { background: var(--danger); color: #fff; border-color: transparent; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }

  /* Keyboard users always get a ring; pointer users never do. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .search { position: relative; flex: 1 1 16rem; min-inline-size: 11rem; display: flex; align-items: center; }
  .search svg:first-child { position: absolute; inset-inline-start: .55rem; color: var(--faint); }
  .search input { padding-inline: 2rem 4.4rem; }
  .search .clear { position: absolute; inset-inline-end: 2.6rem; }
  .search kbd {
    position: absolute; inset-inline-end: .5rem;
    font: 600 .68rem/1.6 ui-monospace, monospace;
    color: var(--faint); border: 1px solid var(--line-strong);
    border-radius: 4px; padding-inline: .3rem; pointer-events: none;
  }

  .picker { display: flex; align-items: center; gap: .3rem; flex: none; }
  .picker > span { font-size: .74rem; color: var(--faint); white-space: nowrap; }
  select, input, textarea {
    padding: .4rem .5rem; border: 1px solid var(--line-strong); border-radius: var(--r-s);
    background: var(--field); color: var(--text); font-size: .85rem; inline-size: 100%;
  }
  /* A stray long property key must not stretch the toolbar. */
  select { inline-size: auto; max-inline-size: 12rem; cursor: pointer; text-overflow: ellipsis; }
  .sep { inline-size: 1px; align-self: stretch; background: var(--line); flex: none; margin-inline: .15rem; }

  .notice {
    display: flex; gap: .5rem; align-items: baseline;
    padding: .4rem var(--pad); font-size: .82rem;
    background: var(--warn-bg); color: var(--warn-fg);
    border-block-end: 1px solid color-mix(in srgb, var(--warn-fg) 30%, transparent);
  }
  .notice[data-kind="ok"] {
    background: var(--accent-soft); color: var(--text);
    border-block-end-color: var(--accent);
  }
  .notice[data-kind="error"] {
    background: var(--err-bg); color: var(--err-fg);
    border-block-end-color: color-mix(in srgb, var(--err-fg) 30%, transparent);
  }
  .notice button { margin-inline-start: auto; }
  /* A closed task's recovery text keeps its lines so it can be copied back as written. */
  .notice > span { white-space: pre-wrap; overflow-wrap: anywhere; max-block-size: 40vh; overflow: auto; }
}

@layer board {
  .column {
    inline-size: clamp(15rem, 21vw, 19rem);
    flex: none;
    display: flex; flex-direction: column;
    min-block-size: 0; max-block-size: 100%;
    background: var(--rail);
    border: 1px solid transparent;
    border-radius: var(--r-l);
    scroll-snap-align: start;
    transition: border-color .14s ease, background-color .14s ease;
  }
  .column.drop-target { border-color: var(--accent); background: var(--accent-soft); }
  .column.column-dragging { opacity: .5; }

  .col-head {
    display: flex; align-items: center; gap: .35rem;
    padding: .5rem .5rem .35rem .6rem;
    cursor: grab;
  }
  .col-head:active { cursor: grabbing; }
  .col-head .dot { inline-size: .5rem; block-size: .5rem; border-radius: 50%; background: var(--hue-accent); flex: none; }
  .col-head h2 {
    font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .col-head .count {
    font-size: .7rem; font-variant-numeric: tabular-nums; color: var(--muted);
    background: var(--card); border-radius: 999px; padding: .05rem .4rem; flex: none;
  }
  .col-head .spacer { margin-inline-start: auto; }
  /* Row controls stay out of the way until the column is touched or focused. */
  .col-tools { display: flex; gap: .1rem; opacity: 0; transition: opacity .14s ease; }
  .column:hover .col-tools, .column:focus-within .col-tools { opacity: 1; }

  .cards {
    display: grid; align-content: start; gap: var(--gap);
    padding: 0 .5rem .5rem; overflow-y: auto; overscroll-behavior-block: contain;
    flex: 1; min-block-size: 3.5rem; scrollbar-width: thin;
  }
  .cards:empty::before {
    content: attr(data-empty);
    display: grid; place-items: center; min-block-size: 3.5rem;
    border: 1px dashed var(--line-strong); border-radius: var(--r-m);
    color: var(--faint); font-size: .78rem; text-align: center; padding: .5rem;
  }

  .column.collapsed { inline-size: 3rem; }
  .column.collapsed .cards, .column.collapsed .col-head .spacer { display: none; }
  .column.collapsed .col-head {
    flex-direction: column; block-size: 100%; padding: .5rem .25rem; gap: .5rem;
  }
  .column.collapsed .col-head h2 {
    writing-mode: vertical-rl; text-orientation: mixed;
    max-block-size: 60%; overflow: hidden; text-overflow: ellipsis;
  }

  .card {
    display: grid; gap: .3rem;
    background: var(--card); color: var(--text);
    padding: var(--card-pad);
    border: 1px solid var(--line);
    border-inline-start: 3px solid var(--hue-accent);
    border-radius: var(--r-m); box-shadow: var(--shadow);
    cursor: grab;
    transition: box-shadow .14s ease, border-color .14s ease;
  }
  .card:hover { box-shadow: var(--lift); }
  .card:focus-within { border-color: var(--accent); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card .meta { display: flex; gap: .35rem; align-items: center; font-size: .7rem; color: var(--faint); }
  .card .meta .id { font-variant-numeric: tabular-nums; }
  .card .type {
    background: var(--hue-soft); color: var(--hue-accent);
    border-radius: 999px; padding: .02rem .4rem; font-weight: 650;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .open {
    all: unset; cursor: pointer;
    font-size: .875rem; font-weight: 600; line-height: 1.35;
    /* Long subjects wrap, they never stretch the column. */
    overflow-wrap: anywhere;
  }
  .card .open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .card .body {
    font-size: .79rem; line-height: 1.45; color: var(--muted); overflow-wrap: anywhere;
    /* Height-based clamp rather than line-clamp: a body is rendered Markdown, so
       it can contain lists and quotes, not just one run of text. */
    max-block-size: calc(var(--body-lines) * 1.45em);
    overflow: hidden;
  }
  .card .body.clipped { mask-image: linear-gradient(to bottom, #000 55%, transparent); }

  /* Rendered Markdown, shared by cards and the editor preview. */
  .md > * { margin-block: 0 .45em; }
  .md > *:last-child { margin-block-end: 0; }
  .md code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em;
    background: var(--rail); border: 1px solid var(--line); border-radius: 4px; padding: 0 .25em;
  }
  .md pre {
    background: var(--rail); border: 1px solid var(--line); border-radius: var(--r-s);
    padding: .5rem; overflow-x: auto;
  }
  .md pre code { background: none; border: 0; padding: 0; }
  .md ul, .md ol { padding-inline-start: 1.15rem; }
  .md li { margin-block: .1em; }
  .md blockquote {
    padding-inline-start: .6rem; border-inline-start: 2px solid var(--line-strong); color: var(--muted);
  }
  .md a { color: var(--accent); }
  .md .md-h { font-weight: 700; color: var(--text); }
  .card .md > * { margin-block: 0 .3em; }

  /* An externally changed card announces itself instead of silently swapping. */
  @keyframes card-updated {
    from { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  }
  .card.updated { animation: card-updated 1.2s ease-out; }

  /* The same idea inside the task: a value that changed in the file blinks once. */
  @keyframes field-updated {
    from { background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
  }
  .updated-field { animation: field-updated 1.2s ease-out; }
  :root[data-density="compact"] .card .body { display: none; }
  .card .chips { display: flex; flex-wrap: wrap; gap: .25rem; }
  .card .chip {
    all: unset; cursor: pointer;
    font-size: .68rem; line-height: 1.5; padding: .02rem .35rem;
    border: 1px solid var(--line); border-radius: var(--r-s); color: var(--muted);
    max-inline-size: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .chip:hover { border-color: var(--accent); color: var(--text); }
  .card .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card .chip b { font-weight: 600; color: var(--faint); }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding-inline: .1em; }

  .board-empty {
    margin: auto; text-align: center; color: var(--muted); display: grid; gap: .6rem;
    justify-items: center; padding: 2rem;
  }
  .board-empty strong { font-size: 1rem; color: var(--text); }
}

@layer editor {
  /* A task opens beside the board by default, so the columns stay usable, and
     can take the whole viewport on request. */
  dialog {
    border: 0; padding: 0; margin: 0;
    inline-size: 100%; max-inline-size: 100%;
    block-size: 100dvh; max-block-size: 100dvh;
    background: var(--page); color: var(--text);
  }
  /* Docked, the task is a column of the page grid beside the board, not a sheet
     laid over it: the header, the search box, the filters and the board's own
     controls all keep their full width. */
  body[data-editor="side"] { grid-template-columns: minmax(0, 1fr) var(--panel-w); }
  body[data-editor="side"] > header  { grid-area: 1 / 1 / 2 / -1; }
  body[data-editor="side"] > .toolbar { grid-area: 2 / 1 / 3 / -1; }
  body[data-editor="side"] > #notice { grid-area: 3 / 1 / 4 / -1; }
  body[data-editor="side"] > main    { grid-area: 4 / 1 / 5 / 2; }
  #modal[data-mode="side"] {
    position: relative;                     /* the splitter anchors to this edge */
    grid-area: 4 / 2 / 5 / 3;
    inline-size: auto; max-inline-size: none;
    block-size: auto; min-block-size: 0; max-block-size: none;
    background: var(--chrome);
    border-inline-start: 1px solid var(--line);
  }
  #modal[data-mode="side"] .sheet { block-size: 100%; }
  #modal[data-mode="side"] .sheet-head, #modal[data-mode="side"] .sheet .actions { background: var(--chrome); }

  .resizer {
    position: absolute; inset-block: 0; inset-inline-start: -5px;
    inline-size: 11px; z-index: 2; cursor: col-resize; touch-action: none;
  }
  .resizer::before {
    content: ''; position: absolute; inset-block: 0; inset-inline-start: 5px;
    inline-size: 1px; background: transparent; transition: background-color .14s ease, inline-size .14s ease;
  }
  .resizer:hover::before, .resizer:focus-visible::before, .resizer[data-dragging]::before {
    background: var(--accent); inline-size: 3px; inset-inline-start: 4px;
  }
  .resizer:focus-visible { outline: none; }
  #modal[data-mode="full"] .resizer { display: none; }
  body[data-resizing] { cursor: col-resize; user-select: none; }
  dialog::backdrop { background: rgb(8 12 20 / .5); }
  /* Flex, not positional grid rows: the conflict banner comes and goes, and with
     rows the footer inherited the growing row whenever it was hidden.
     --sheet-inline centres the content on a wide screen instead of stretching
     a text field across two thousand pixels. */
  .sheet {
    --sheet-inline: var(--pad);
    display: flex; flex-direction: column;
    block-size: 100dvh; overflow: hidden;
  }
  .sheet > * { flex: none; }
  .sheet-head-actions { display: flex; align-items: center; gap: .4rem; }

  /* An external change never discards the draft: it raises this and waits. */
  .conflict {
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem;
    padding: .6rem var(--sheet-inline);
    background: var(--warn-bg); color: var(--warn-fg);
    border-block-end: 1px solid color-mix(in srgb, var(--warn-fg) 30%, transparent);
    font-size: .85rem;
  }
  .conflict-actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-inline-start: auto; }
  .conflict .ghost { border-color: currentColor; color: inherit; }
  .conflict .ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--warn-fg) 15%, transparent); }

  /* The notify panel is a sized dialog, not the full-viewport task sheet. */
  #notify {
    margin: auto;                   /* the task sheet sets margin 0 to fill the viewport */
    inline-size: min(34rem, 100% - 1.5rem); block-size: auto;
    max-block-size: min(90dvh, 42rem); border-radius: var(--r-l);
    background: var(--card);
  }
  .panel { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-block-size: inherit; }
  .panel-body { padding: var(--pad); overflow: auto; }
  .panel textarea { min-block-size: 7rem; }
  .status { font-size: .82rem; margin-block-start: .4rem; }
  .status[data-kind="error"] { color: var(--danger); }
  .status[data-kind="ok"] { color: var(--accent); }

  /* The card's notify control stays out of the way until the card is touched. */
  .card .meta .notify { margin-inline-start: auto; padding: .1rem; opacity: 0; }
  .card:hover .meta .notify, .card:focus-within .meta .notify, .card .meta .notify:focus-visible { opacity: 1; }
  @media (hover: none) { .card .meta .notify { opacity: 1; } }
  .sheet-head {
    display: flex; flex-wrap: nowrap; align-items: flex-start; justify-content: space-between; gap: 1rem;

      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        const buf = [lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, '')];
        while (i < lines.length && lines[i].trim() && !BLOCK_START.test(lines[i])) buf.push(lines[i++].trim());
        list.append(inlineMd(buf.join(' '), el('li')));
      }
      out.append(list);
    } else {
      const buf = [];
      while (i < lines.length && lines[i].trim() && !BLOCK_START.test(lines[i])) buf.push(lines[i++]);
      out.append(inlineMd(buf.join(' '), el('p')));
    }
  }
  return out;
}

/* ---------- search highlighting ---------- */
const terms = () => prefs.query.trim().toLowerCase().split(/\s+/).filter(Boolean);

function highlightFragment(text, list) {
  const out = document.createDocumentFragment();
  let rest = text, found = false;
  while (rest) {
    let at = -1, len = 0;
    for (const term of list) {
      const i = rest.toLowerCase().indexOf(term);
      if (i >= 0 && (at < 0 || i < at)) { at = i; len = term.length; }
    }
    if (at < 0) { out.append(rest); break; }
    found = true;
    out.append(rest.slice(0, at), el('mark', null, rest.slice(at, at + len)));
    rest = rest.slice(at + len);
  }
  return found ? out : null;
}
function highlight(node, text) {
  const list = terms();
  node.textContent = text;
  if (list.length) {
    const marked = highlightFragment(text, list);
    if (marked) node.replaceChildren(marked);
  }
  return node;
}
/* Marks matches inside already-rendered Markdown without disturbing its structure. */
function markMatches(root) {
  const list = terms();
  if (!list.length) return root;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const texts = [];
  for (let n = walker.nextNode(); n; n = walker.nextNode()) texts.push(n);
  for (const node of texts) {
    const marked = highlightFragment(node.nodeValue, list);
    if (marked) node.replaceWith(marked);
  }
  return root;
}
function mdInto(node, text) {
  node.replaceChildren(markdown(text));
  return markMatches(node);
}

/* ---------- cards ---------- */
/* Only bodies that actually overflow get the fade, so short ones stay crisp. */
const pendingMeasure = new Set();
function measureBodies() {
  for (const node of pendingMeasure) {
    const body = $('.body', node);
    if (body) body.classList.toggle('clipped', body.scrollHeight - body.clientHeight > 2);
  }
  pendingMeasure.clear();
}
function flash(node) {
  node.classList.remove('updated');
  void node.offsetWidth;                  /* restart the animation */
  node.classList.add('updated');
  setTimeout(() => node.classList.remove('updated'), 1400);
}

const cardSignature = t =>
  JSON.stringify([t.task_type, t.subject, t.body, t.properties, prefs.query, prefs.groupBy]);
/* Content as the file holds it, so a filter change never looks like an edit. */
let lastContent = new Map(), flashChanged = false;

function fillCard(node, t) {
  node.dataset.sig = cardSignature(t);
  node.style.setProperty('--hue', hue(t.task_type));
  const meta = el('div', 'meta');
  meta.append(el('span', 'id', '#' + t.id), el('span', 'type', t.task_type));
  const bell = el('button', 'bare notify');
  bell.type = 'button';
  bell.append(icon(GLYPH.bell, 13));
  bell.title = 'Notify a crew member about this task';
  bell.setAttribute('aria-label', 'Notify a crew member about task ' + t.id);
  bell.onclick = e => { e.stopPropagation(); openNotify(t); };
  bell.ondragstart = e => e.preventDefault();     /* the bell is a button, not a drag handle */
  meta.append(bell);
  const open = el('button', 'open');
  open.type = 'button';
  highlight(open, t.subject);
  open.onclick = e => { e.stopPropagation(); openEditor(t); };
  const parts = [meta, open];
  if (t.body) parts.push(mdInto(el('div', 'body md'), t.body));
  const chips = otherProps(t).filter(p => p.value.trim() && p.key !== prefs.groupBy);
  if (chips.length) {
    const row = el('div', 'chips');
    for (const p of chips) {
      const chip = el('button', 'chip');
      chip.type = 'button';
      chip.append(el('b', null, p.key + ':'), ' ' + p.value);
      chip.title = 'Filter by ' + p.key + ': ' + p.value;
      chip.onclick = e => { e.stopPropagation(); setQuery(p.value); };
      row.append(chip);
    }
    parts.push(row);
  }
  node.replaceChildren(...parts);
  pendingMeasure.add(node);
  return node;
}

function cardNode(t) {
  const node = el('article', 'card');
  node.draggable = true;
  node.dataset.id = t.id;
  /* Handlers are bound once and read the task at event time, because the node
     outlives any single poll. */
  const task = () => doc.tasks.find(x => x.id === Number(node.dataset.id));
  node.onclick = () => { const x = task(); if (x) openEditor(x); };
  node.ondragstart = e => {
    const x = task();
    if (!x) return;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('frump/task', String(x.id));
    e.dataTransfer.setData('text/plain', '#' + x.id + ' ' + x.subject);
    node.classList.add('dragging');
    dragActive = true;
  };
  node.ondragend = () => { node.classList.remove('dragging'); endDrag(); };
  /* Keyboard equivalent of the drag: move a card without a pointer. */
  node.onkeydown = e => {
    if (!e.altKey || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    const x = task();
    if (!x) return;
    e.preventDefault();
    const keys = groupKeys(visibleTasks());
    const next = keys[keys.indexOf(valueOf(x, prefs.groupBy)) + (e.key === 'ArrowRight' ? 1 : -1)];
    if (next !== undefined) move(x.id, next);
  };
  return fillCard(node, t);
}

/* ---------- columns ---------- */
const columnIndex = col => [...board.children].indexOf(col);

function columnNode(key) {
  const col = el('section', 'column');
  col.dataset.key = key;

  const head = el('div', 'col-head');
  head.draggable = true;
  head.append(el('span', 'dot'), el('h2'), el('span', 'count'), el('span', 'sr-only'));

  const tools = el('div', 'col-tools');
  const nudge = (dir, glyph) => {
    const b = el('button', 'bare');
    b.type = 'button';
    b.append(icon(glyph));
    b.onclick = () => reorder(col.dataset.key, columnIndex(col) + dir);
    return b;
  };
  tools.append(nudge(-1, GLYPH.left), nudge(1, GLYPH.right));
  const spacer = el('div', 'spacer');
  spacer.append(tools);

  const toggle = el('button', 'bare');
  toggle.type = 'button';
  toggle.onclick = () => {
    const list = slot(prefs.collapsed, prefs.groupBy), at = list.indexOf(col.dataset.key);
    at < 0 ? list.push(col.dataset.key) : list.splice(at, 1);
    savePrefs(); render();
  };
  head.append(spacer, toggle);

  const cards = el('div', 'cards');

  /* dragenter/dragleave fire for every descendant, so count nesting depth
     instead of clearing the highlight on the first leave. */
  let depth = 0;
  const clear = () => { depth = 0; col.classList.remove('drop-target'); };
  col.ondragenter = e => {
    if (!e.dataTransfer.types.includes('frump/task')) return;
    depth++; col.classList.add('drop-target');
  };
  col.ondragover = e => {
    const types = e.dataTransfer.types;
    if (!types.includes('frump/task') && !types.includes('frump/column')) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  };
  col.ondragleave = () => { if (--depth <= 0) clear(); };
  col.ondrop = e => {
    e.preventDefault(); clear();
    const task = e.dataTransfer.getData('frump/task');
    const from = e.dataTransfer.getData('frump/column');
    const target = col.dataset.key, at = columnIndex(col);
    endDrag();
    if (task) move(Number(task), target);
    else if (from) reorder(from, at);
  };
  head.ondragstart = e => {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('frump/column', col.dataset.key);
    col.classList.add('column-dragging');
    dragActive = true;
  };
  head.ondragend = () => { col.classList.remove('column-dragging'); endDrag(); };

  col.append(head, cards);
  return col;
}

function updateColumn(col, key, at, keys, tasks) {
  const name = label(key);
  col.style.setProperty('--hue', hue(name));
  const collapsed = slot(prefs.collapsed, prefs.groupBy).includes(key);
  col.classList.toggle('collapsed', collapsed);

  const head = $('.col-head', col), heading = $('h2', head);
  heading.id = 'col-' + at;
  heading.textContent = name;
  $('.count', head).textContent = String(tasks.length);
  $('.sr-only', head).textContent = tasks.length === 1 ? '1 task' : tasks.length + ' tasks';
  const [left, right] = $$('.col-tools button', head);
  left.disabled = at === 0;
  right.disabled = at === keys.length - 1;
  left.setAttribute('aria-label', 'Move column ' + name + ' left');
  right.setAttribute('aria-label', 'Move column ' + name + ' right');
  const toggle = head.lastElementChild;
  toggle.replaceChildren(icon(collapsed ? GLYPH.expand : GLYPH.collapse));
  toggle.setAttribute('aria-label', (collapsed ? 'Expand' : 'Collapse') + ' column ' + name);
  toggle.setAttribute('aria-expanded', String(!collapsed));

  const cards = $('.cards', col);
  cards.dataset.empty = prefs.query || prefs.type ? 'No matching tasks' : 'Drop a task here';
  cards.setAttribute('aria-labelledby', heading.id);

  /* Keyed reconciliation: an unchanged card keeps its exact DOM node, so a poll
     never disturbs focus, selection, hover or the column's scroll position. */
  const have = new Map($$('.card', cards).map(c => [c.dataset.id, c]));
  sortTasks(tasks).forEach((t, i) => {
    const id = String(t.id);
    const content = taskSignature(t), known = lastContent.get(t.id);
    const changed = flashChanged && known !== undefined && known !== content;
    let node = have.get(id);
    if (node) {
      have.delete(id);
      if (node.dataset.sig !== cardSignature(t)) { fillCard(node, t); if (changed) flash(node); }
    } else {
      node = cardNode(t);
      /* A status, type or property change moves the card, so its node is new;
         it should still announce itself. */
      if (changed) flash(node);
    }
    if (cards.children[i] !== node) cards.insertBefore(node, cards.children[i] || null);
  });
  for (const stale of have.values()) stale.remove();
}

function reorder(key, to) {
  const keys = groupKeys(visibleTasks());
  const next = keys.filter(k => k !== key);
  next.splice(Math.max(0, Math.min(to, next.length)), 0, key);
  prefs.order[docKey] ||= {};
  prefs.order[docKey][prefs.groupBy] = next;
  savePrefs(); render();
  announce('Column ' + label(key) + ' moved to position ' + (next.indexOf(key) + 1) + ' of ' + next.length);
}

/* ---------- board ---------- */
let dragActive = false, renderQueued = false;
function endDrag() {
  dragActive = false;
  if (renderQueued) { renderQueued = false; render(); }
}

function emptyState() {
  const empty = el('div', 'board-empty');
  empty.append(el('strong', null, 'No tasks match this search'),
    el('p', null, 'Clear the filters to see the whole board.'));
  const reset = el('button', 'ghost', 'Clear filters');
  reset.type = 'button';
  reset.onclick = () => { $('#type-filter').value = prefs.type = ''; setQuery(''); };
  empty.append(reset);
  return empty;
}

function render() {
  /* A refresh landing mid-drag would pull the card out from under the pointer. */
  if (dragActive) { renderQueued = true; return; }
  const tasks = visibleTasks();
  const keys = groupKeys(tasks);

  if (!tasks.length && (prefs.query || prefs.type)) {
    board.replaceChildren(emptyState());
  } else {
    if (!board.firstElementChild?.classList.contains('column')) board.replaceChildren();
    const have = new Map($$('.column', board).map(c => [c.dataset.key, c]));
    keys.forEach((key, i) => {
      let col = have.get(key);
      if (col) have.delete(key); else col = columnNode(key);
      updateColumn(col, key, i, keys, tasks.filter(t => valueOf(t, prefs.groupBy) === key));
      if (board.children[i] !== col) board.insertBefore(col, board.children[i] || null);
    });
    for (const stale of have.values()) stale.remove();
    requestAnimationFrame(measureBodies);
  }

  lastContent = new Map(doc.tasks.map(t => [t.id, taskSignature(t)]));
  flashChanged = false;

  const title = documentTitle();
  $('#board-title').textContent = title || 'Frump board';
  document.title = title ? title + ' — Frump board' : 'Frump Board';
  const total = doc.tasks.length, shown = tasks.length;
  $('#board-summary').textContent =
    (shown === total ? total + (total === 1 ? ' task' : ' tasks')
      : shown + ' of ' + total + ' tasks') + ' · ' + keys.length +
    (keys.length === 1 ? ' column' : ' columns') + ' by ' + prefs.groupBy;
}

/* ---------- where the task opens: docked beside the board, or over it ---------- */
const NARROW = '(width <= 62rem)';
let switchingMode = false;
/* Below the breakpoint a dock would leave nothing for the board, so the stored
   preference is honoured only where there is room for it. */
const effectiveMode = () => (window.matchMedia(NARROW).matches ? 'full' : (prefs.editorMode || 'side'));

function applyEditorMode() {
  const mode = effectiveMode();
  modal.dataset.mode = mode;
  document.body.dataset.editor = modal.open && mode === 'side' ? 'side' : '';
  const full = mode === 'full', button = $('#editor-mode');
  button.replaceChildren(icon(full ? GLYPH.goSide : GLYPH.goFull));
  button.setAttribute('aria-pressed', String(full));
  button.setAttribute('aria-label', full ? 'Show the task beside the board' : 'Open the task full screen');
  button.title = button.getAttribute('aria-label');
  button.disabled = window.matchMedia(NARROW).matches;
}

function showEditor() {
  const mode = effectiveMode();
  if (modal.open) {
    if (modal.dataset.mode === mode) { applyEditorMode(); return; }
    /* close() fires its event asynchronously, so the flag is cleared by the
       handler itself; clearing it here would let the real close logic run and
       drop the task being edited. */
    switchingMode = true;
    modal.close();
  }
  /* Docked is deliberately non-modal: the board behind it stays draggable. */
  mode === 'full' ? modal.showModal() : modal.show();
  applyEditorMode();
}

/* The dock is a working surface, so its width is the reader's to choose and is
   remembered like every other view preference. */
/* The only real limits are mechanical: the divider has to stay grabbable, and a
   panel too narrow to grab could not be dragged back. Everything between is the
   reader's business, so there is no taste-based ceiling here. */
const PANEL_MIN = 240, BOARD_MIN = 96;
const panelMax = () => Math.max(PANEL_MIN, window.innerWidth - BOARD_MIN);
const resizer = $('#panel-resizer');

function panelWidthNow() {
  return prefs.panelWidth || Math.round(modal.getBoundingClientRect().width) || PANEL_MIN;
}
function setPanelWidth(px, remember) {
  const width = Math.round(Math.max(PANEL_MIN, Math.min(px, panelMax())));
  document.documentElement.style.setProperty('--panel-w', width + 'px');
  resizer.setAttribute('aria-valuenow', String(width));
  resizer.setAttribute('aria-valuemin', String(PANEL_MIN));
  resizer.setAttribute('aria-valuemax', String(Math.round(panelMax())));
  if (remember) { prefs.panelWidth = width; savePrefs(); }
  return width;
}
function resetPanelWidth() {
  delete prefs.panelWidth;
  savePrefs();
  document.documentElement.style.removeProperty('--panel-w');
  announce('Task panel width reset');
}

resizer.addEventListener('pointerdown', e => {
  if (modal.dataset.mode !== 'side') return;
  e.preventDefault();
  resizer.setPointerCapture(e.pointerId);
  resizer.dataset.dragging = '1';
  document.body.dataset.resizing = '1';
});
resizer.addEventListener('pointermove', e => {
  if (!resizer.dataset.dragging) return;
  setPanelWidth(window.innerWidth - e.clientX, false);
});
const endResize = e => {
  if (!resizer.dataset.dragging) return;
  delete resizer.dataset.dragging;
  delete document.body.dataset.resizing;
  try { resizer.releasePointerCapture(e.pointerId); } catch {}
  setPanelWidth(Math.round(modal.getBoundingClientRect().width), true);
};
resizer.addEventListener('pointerup', endResize);
resizer.addEventListener('pointercancel', endResize);
resizer.addEventListener('dblclick', resetPanelWidth);
/* A splitter is operable from the keyboard, not only by dragging. */
resizer.addEventListener('keydown', e => {
  const step = e.shiftKey ? 96 : 24, width = panelWidthNow();
  if (e.key === 'ArrowLeft') { e.preventDefault(); setPanelWidth(width + step, true); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setPanelWidth(width - step, true); }
  else if (e.key === 'Home') { e.preventDefault(); setPanelWidth(panelMax(), true); }
  else if (e.key === 'End') { e.preventDefault(); setPanelWidth(PANEL_MIN, true); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); resetPanelWidth(); }
});
window.addEventListener('resize', () => { if (prefs.panelWidth) setPanelWidth(prefs.panelWidth, false); });

$('#editor-mode').onclick = () => {
  prefs.editorMode = effectiveMode() === 'full' ? 'side' : 'full';
  savePrefs();
  showEditor();
  form.subject.focus();
};
window.matchMedia(NARROW).addEventListener('change', () => { if (modal.open) showEditor(); else applyEditorMode(); });

/* ---------- restoring the view after a reload ---------- */
/* Everything a reader would call "where I was": the filters and layout already
   live in prefs, so this adds the scroll offsets, the open task and its draft. */
let restorePending = true;

function scrollSlot() {
  const perDoc = prefs.scroll[docKey] ||= {};
  return perDoc[prefs.groupBy] ||= { board: 0, columns: {} };
}
const rememberScroll = debounce(() => {
  if (!board.querySelector('.column')) return;
  const slot = scrollSlot();
  slot.board = board.scrollLeft;
  for (const col of $$('.column', board)) slot.columns[col.dataset.key] = $('.cards', col).scrollTop;
  savePrefs();
}, 300);
function restoreScroll() {
  const slot = scrollSlot();
  board.scrollLeft = slot.board || 0;
  for (const col of $$('.column', board)) {
    const y = slot.columns?.[col.dataset.key];
    if (y) $('.cards', col).scrollTop = y;
  }
}
board.addEventListener('scroll', rememberScroll, true);

/* Both dialogs are addressable, so a reload reopens exactly what was open and
   Back steps out of it. */
let historySync = false;
function parseRoute() {
  let m = location.hash.match(/^#task\/(new|\d+)(\/notify)?$/);
  if (m) {
    const task = m[1] === 'new' ? 'new' : Number(m[1]);
    return { task, notify: m[2] && task !== 'new' ? task : null };
  }
  m = location.hash.match(/^#notify\/(\d+)$/);
  if (m) return { task: null, notify: Number(m[1]) };
  return { task: null, notify: null };
}
function currentRoute() {
  return {
    task: modal.open ? (editing ? editing.id : 'new') : null,
    notify: notifyDialog.open && notifyTask ? notifyTask.id : null,
  };
}
function routeHash({ task, notify }) {
  if (task !== null && notify !== null) return '#task/' + task + '/notify';
  if (task !== null) return '#task/' + task;
  if (notify !== null) return '#notify/' + notify;
  return '';
}
function syncRoute(replace) {
  if (historySync) return;
  const want = routeHash(currentRoute());
  if (want === (location.hash || '')) return;
  const url = want || location.pathname + location.search;
  /* Stepping out of a view we pushed ourselves is a Back, so the history stays
     the length of the path the user actually walked. */
  if (!replace && want.length < (location.hash || '').length && history.state?.route) {
    history.back();
    return;
  }
  const args = [{ route: want }, '', url];
  replace ? history.replaceState(...args) : history.pushState(...args);
}
window.addEventListener('popstate', () => {
  historySync = true;
  const want = parseRoute();
  if (want.task === null) { if (modal.open) closeEditor(); }
  else if (want.task === 'new') { if (!modal.open) openEditor(); }
  else {
    const t = doc.tasks.find(x => x.id === want.task);
    if (t && editing?.id !== want.task) openEditor(t);
  }
  if (want.notify === null) { if (notifyDialog.open && !notifyPending) notifyDialog.close(); }
  else {
    const t = doc.tasks.find(x => x.id === want.notify);
    if (t && (!notifyDialog.open || notifyTask?.id !== want.notify)) openNotify(t);
  }
  historySync = false;
});

function draftProperties() {
  return $$('.property').map(r => ({
    key: $('.property-key', r).value.trim(), value: $('.property-value', r).value,
  })).filter(p => p.key);
}
function formSnapshot() {
  return {
    subject: form.subject.value, task_type: form.task_type.value,
    body: form.body.value, status: $('#status').value, properties: draftProperties(),
  };
}
let baseSnapshot = '';
const isDirty = () => JSON.stringify(formSnapshot()) !== baseSnapshot;
/* Nothing to cancel means nothing to warn about, so the button says so. */
function updateDirty() {
  const dirty = isDirty();
  $('#cancel').textContent = dirty ? 'Cancel' : 'Close';
  $('#cancel').setAttribute('aria-label', dirty ? 'Discard unsaved changes and close' : 'Close task view');
}
function persistDraft(force) {
  if ((!modal.open && !force) || !isDirty()) { clearDraft(); return; }
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ docKey, id: editing?.id ?? null, form: formSnapshot() }));
  } catch {}
}
const saveDraft = debounce(persistDraft, 400);
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch {} }

/* A draft is only restored into the task it was written for, and it says so
   when it differs from what the file now holds. */
function applyDraft() {
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch {}
  if (!draft || draft.docKey !== docKey) return;
  if ((draft.id ?? null) !== (editing?.id ?? null)) return;
  if (JSON.stringify(formSnapshot()) === JSON.stringify(draft.form)) return;
  form.subject.value = draft.form.subject;
  form.task_type.value = draft.form.task_type;
  form.body.value = draft.form.body;
  $('#status').value = draft.form.status;
  $('#properties').replaceChildren();
  draft.form.properties.forEach(pair => propertyRow(pair));
  updateDirty();
  showConflict('Your unsaved draft was restored. The file version is still on disk.',
    editing ? ['conflict-reload', 'conflict-keep'] : ['conflict-keep']);
}

function restoreView() {
  if (!restorePending) return;
  restorePending = false;
  restoreScroll();
  const want = parseRoute();
  historySync = true;            /* opening these must not rewrite the route we are reading */
  if (want.task === 'new') openEditor();
  else if (want.task !== null) {
    const t = doc.tasks.find(x => x.id === want.task);
    if (t) openEditor(t);
  }
  if (want.notify !== null) {
    const t = doc.tasks.find(x => x.id === want.notify);
    if (t) openNotify(t);
  }
  historySync = false;
  /* A route naming something the file no longer holds clears itself. */
  if (routeHash(currentRoute()) !== (location.hash || '')) syncRoute(true);
}

/* ---------- controls ---------- */
function syncPickers() {
  const groups = $('#group-by');
  const keys = propertyKeys();
  if (!keys.includes(prefs.groupBy)) prefs.groupBy = STATUS;
  groups.replaceChildren(...keys.map(k => new Option(k, k, false, k === prefs.groupBy)));
  const types = $('#type-filter');
  if (prefs.type && !taskTypes().includes(prefs.type)) prefs.type = '';
  types.replaceChildren(new Option('All', '', false, !prefs.type),
    ...taskTypes().map(t => new Option(t, t, false, t === prefs.type)));
  $('#sort').value = prefs.sort;
  $('#hide-empty').setAttribute('aria-pressed', String(prefs.hideEmpty));
  $('#density').setAttribute('aria-pressed', String(prefs.density === 'compact'));
  document.documentElement.dataset.density = prefs.density;

      ? 'This task was removed from the file while you were editing. Your draft is still here.'
      : 'This task was removed from the file.',

  if (signature === editingBase) { hideConflict(); return; }   /* the change was elsewhere in the file */

     saved it or because the same edit arrived from elsewhere. */
  if (signature === taskSignature(input())) { editingBase = signature; hideConflict(); return; }

async function load() {

    if (!r.ok) throw Error(await r.text());
    const next = await r.json(), revision = JSON.stringify(next);
    fileValid = true; $('#new').disabled = false;
    if (revision !== lastRevision) {
      doc = next; lastRevision = revision;
      docKey = documentTitle() || 'default';
      flashChanged = true;        /* this render is showing someone else's edit */
      syncPickers(); render();
      checkEditorConflict();
      restoreView();          /* last: a restored draft's notice must not be cleared */
    }

  } catch (e) {
    /* The file is unreadable for now. Saving is paused, but an open draft stays
       on screen: closing the editor here would throw away the user's work. */
    fileValid = false; $('#new').disabled = true;
    if (editing !== null) showConflict('The task file cannot be read right now, so saving is paused. Your draft is kept.', []);

/* A refusal stays on screen next to the button that caused it: it is the answer

async function save() {
  if (!fileValid) {
    showConflict('The task file cannot be read right now, so saving is paused. Your draft is kept.', []);
    return;
  }
  const creating = !editing;
  const url = creating ? '/api/tasks' : '/api/tasks/' + editing.id;
  const r = await fetch(url, {
    method: creating ? 'POST' : 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(input()),
  });
  if (!r.ok) throw Error(await r.text());
  const { warning, ...saved } = await r.json();
  editing = saved;
  editingBase = taskSignature(saved);
  conflictDismissed = null;
  hideConflict();
  clearDraft();
  if (creating) syncRoute(true);  /* #task/new becomes the id it was given */
  saveState(creating ? 'Created #' + saved.id : 'Saved');

async function move(id, key) {

  if (key !== UNSET && key !== '') properties.push({ key: prefs.groupBy, value: key });

  if (warning) notice(warning, 'warn', true);

/* ---------- Markdown editing in the body field ---------- */
const LIST_LINE = /^(\s*)(?:([-*+])|(\d+)([.)]))([ \t]+)(\[[ xX]\][ \t]+)?(.*)$/;
const QUOTE_LINE = /^(\s*)(>[ \t]?)(.*)$/;

  try { done = text ? document.execCommand('insertText', false, text) : document.execCommand('delete'); } catch {}
  if (!done) ta.setRangeText(text, start, end, 'end');

  const openTag = ta.value.slice(from - before.length, from);
  const closeTag = ta.value.slice(to, to + after.length);
  if (openTag === before && closeTag === after) {          /* toggle back off */
    editText(ta, from - before.length, to + after.length, selected,
      from - before.length, from - before.length + selected.length);
    return;
  }
  editText(ta, from, to, before + selected + after,
    from + before.length, from + before.length + selected.length);
}

function markdownEditor(ta) {
  ta.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    const { selectionStart: from, selectionEnd: to, value } = ta;

    if (mod && e.key === 'Enter') { e.preventDefault(); form.requestSubmit(); return; }
    if (mod && !e.altKey) {
      const key = e.key.toLowerCase();
      if (key === 'b') { e.preventDefault(); wrapSelection(ta, '**'); return; }
      if (key === 'i') { e.preventDefault(); wrapSelection(ta, '_'); return; }
      if (key === 'k') {
        e.preventDefault();
        const text = value.slice(from, to);
        editText(ta, from, to, '[' + text + '](url)', from + text.length + 3, from + text.length + 6);
        return;
      }
      return;
    }

    /* A selection plus an emphasis character wraps instead of replacing. */
    if (from !== to && ['*', '_', '`'].includes(e.key)) {
      e.preventDefault();
      wrapSelection(ta, e.key);
      return;
    }

    if (e.key === 'Enter' && !e.shiftKey && from === to) {
      const [lineStart] = lineBounds(value, from, from);
      const line = value.slice(lineStart, from);
      const item = line.match(LIST_LINE);
      if (item) {
        const [, indent, bullet, number, delim, space, check, content] = item;
        e.preventDefault();
        if (!content.trim()) { editText(ta, lineStart, from, ''); return; }   /* empty item ends the list */
        const marker = bullet || (Number(number) + 1) + delim;
        editText(ta, from, from, '\n' + indent + marker + space + (check ? '[ ] ' : ''));
        return;
      }
      const quote = line.match(QUOTE_LINE);
      if (quote) {
        e.preventDefault();
        if (!quote[3].trim()) { editText(ta, lineStart, from, ''); return; }
        editText(ta, from, from, '\n' + quote[1] + '> ');

      return;
    }

    if (e.key === 'Tab') {
      const [blockStart, blockEnd] = lineBounds(value, from, to);
      const block = value.slice(blockStart, blockEnd);
      const multiline = block.includes('\n');
      /* Outside a list a single Tab still moves focus, which keyboard users need. */
      if (!multiline && !LIST_LINE.test(block) && !QUOTE_LINE.test(block)) return;
      e.preventDefault();

      const shifted = lines.map((line, i) => {
        if (e.shiftKey) {
          const removed = line.match(/^ {1,2}/)?.[0].length || 0;
          if (i === 0) firstDelta = -removed;
          total -= removed;
          return line.slice(removed);
        }
        if (i === 0) firstDelta = 2;
        total += 2;
        return '  ' + line;
      });
      editText(ta, blockStart, blockEnd, shifted.join('\n'),
        Math.max(blockStart, from + firstDelta), Math.max(blockStart, to + total));
    }
  });
}

  if (!notifyDialog.open) notifyDialog.showModal();
  syncRoute();
  $('#notify-message').focus();
}
$('#notify-form').addEventListener('input', saveNotifyDraft);
$('#notify-open').onclick = () => openNotify(editing);
$('#notify-cancel').onclick = () => { if (!notifyPending) notifyDialog.close(); };
$('#notify-close').onclick = () => { if (!notifyPending) notifyDialog.close(); };
notifyDialog.addEventListener('click', e => { if (e.target === notifyDialog && !notifyPending) notifyDialog.close(); });
notifyDialog.addEventListener('close', () => { notifyTask = null; setNotifyStatus(''); syncRoute(); });

/* If the panel was dismissed while the request was in flight, the failure still
   has to reach the user, so it moves to the sticky notice bar. */
function report(id, text) {
  if (notifyDialog.open) setNotifyStatus(text, 'error');
  else notice('Notification about task ' + id + ' failed: ' + text, 'error', true);
}
$('#notify-form').onsubmit = async e => {
  e.preventDefault();
  if (!notifyTask || notifyPending) return;
  const recipient = $('#notify-recipient').value.trim() || 'data';
  const message = $('#notify-message').value;
  const id = notifyTask.id;
  notifyBusy(true);
  setNotifyStatus('Sending to ' + recipient + '…');
  try {
    const r = await fetch('/api/tasks/' + id + '/notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recipient, message }),
    });
    if (r.ok) {                                   /* 204 by contract */
      notifyBusy(false);
      $('#notify-message').value = '';            /* a sent message must not be sent twice */
      notifyDraftFor = null;
      saveNotifyDraft.cancel();
      clearNotifyDraft();
      announce('Notification about task ' + id + ' sent to ' + recipient);
      if (notifyDialog.open) {
        setNotifyStatus('Sent to ' + recipient + '.', 'ok');
        setTimeout(() => { if (!notifyPending) notifyDialog.close(); }, 900);
      } else {
        notice('Notification about task ' + id + ' sent to ' + recipient + '.', 'ok', true);
      }
      return;
    }
    /* Any non-OK body is displayable failure text; the typed message is kept. */
    report(id, (await r.text()).trim() || 'The notification was refused.');
  } catch (err) {
    report(id, 'Could not reach the local server: ' + err.message);
  }
  notifyBusy(false);
};
$('#add-property').onclick = () => $('.property-key', propertyRow()).focus();
$('#delete').onclick = async () => {
  if (!editing || !confirm('Delete task #' + editing.id + '?')) return;
  const id = editing.id, r = await fetch('/api/tasks/' + id, { method: 'DELETE' });
  if (!r.ok) {
    saveState((await r.text()).trim(), 'error');
    notice('Task ' + id + ' was not deleted.', 'error', true);
    return;                       /* the task is still there, so the view stays on it */
  }
  /* Delete is frump close; a task whose current text HEAD does not hold comes back as a
     warning with that text, and it stays on screen until the user dismisses it. */
  const { warning } = await r.json();
  closeEditor(true);
  await load();
  if (warning) notice(warning, 'warn', true);
  announce('Task ' + id + ' deleted');
};
form.onsubmit = async e => {
  e.preventDefault();
  clearSaveState();
  try { await save(); }
  catch (err) {
    /* The task view keeps the reason where the user is looking, and the sticky
       notice survives the next poll for anyone who closed the view. */
    saveState(err.message, 'error');
    notice('Task not saved: ' + err.message, 'error', true);
  }
};

$('#query').oninput = e => setQuery(e.target.value);
$('#query').onkeydown = e => { if (e.key === 'Escape' && prefs.query) { e.preventDefault(); setQuery(''); } };
$('#clear-query').onclick = () => { setQuery(''); $('#query').focus(); };
$('#group-by').onchange = e => { prefs.groupBy = e.target.value; savePrefs(); render(); restoreScroll(); };
$('#sort').onchange = e => { prefs.sort = e.target.value; savePrefs(); render(); };
$('#type-filter').onchange = e => { prefs.type = e.target.value; savePrefs(); render(); };
$('#hide-empty').onclick = e => {
  prefs.hideEmpty = !prefs.hideEmpty;
  e.currentTarget.setAttribute('aria-pressed', String(prefs.hideEmpty));
  savePrefs(); render();
};
$('#density').onclick = () => {
  prefs.density = prefs.density === 'compact' ? 'cozy' : 'compact';
  savePrefs(); syncPickers(); render();
};
$('#theme').onclick = () => {
  prefs.theme = { auto: 'light', light: 'dark', dark: 'auto' }[prefs.theme];
  savePrefs(); syncPickers();
};
$('#reset-layout').onclick = () => {
  delete prefs.order[docKey];
  delete prefs.collapsed[docKey];
  savePrefs(); render();
  announce('Column layout reset');
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.open && modal.dataset.mode === 'side' && !notifyDialog.open) {
    e.preventDefault();
    closeEditor();              /* same meaning as Escape on the full-screen sheet */
    return;
  }
  if (modal.open || e.ctrlKey || e.metaKey || e.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if (e.key === '/' && !typing) { e.preventDefault(); $('#query').focus(); $('#query').select(); }
  else if (e.key.toLowerCase() === 'n' && !typing) { e.preventDefault(); openEditor(); }
});

combobox($('#status'), () => valuesForKey(STATUS));
combobox(form.task_type, () => taskTypes());
markdownEditor(form.body);

loadPrefs();
if (prefs.panelWidth) setPanelWidth(prefs.panelWidth, false);
applyEditorMode();
syncPickers();
$('#query').value = prefs.query || '';
$('#clear-query').classList.toggle('hidden', !prefs.query);
load();
setInterval(load, 1000);
</script></body></html>
